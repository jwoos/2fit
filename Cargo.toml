[workspace]
resolver = "2"
members = ["core", "generator", "scraper"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"

[workspace.dependencies]
rustyfit = "0.10.2"
embedded-io-adapters = { version = "0.7.0", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ureq = "3"
rss = "2"
chrono = "0.4"
html-escape = "0.2"
quick-xml = { version = "0.37", features = ["serialize"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"